name: Build iOS Payload

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build the App (Unsigned for Jailbroken Devices)
        run: |
          xcodebuild clean build             -project DarkSword.xcodeproj             -scheme DarkSword             -configuration Release             -sdk iphoneos             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_ENTITLEMENTS=""             CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/DarkSword.app Payload/
          zip -r DarkSword.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkSword-Payload
          path: DarkSword.ipa
